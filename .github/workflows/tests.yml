name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  django-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py test
        env:
          SECRET_KEY: ci-test-secret-with-at-least-50-random-characters-0123456789-abcdefgh
          DEBUG: "True"
