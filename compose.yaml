services:
  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/db.sqlite3
    ports:
      - "${APP_PORT_BIND:-127.0.0.1:8000}:8000"
    volumes:
      - ledger_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  ledger_data:
